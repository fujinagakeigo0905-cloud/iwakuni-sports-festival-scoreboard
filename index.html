<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c72"><title>山口県立岩国高等学校附属中学校　第１回体育祭　スコアボード</title><style>
:root{--navy:#123c72;--blue:#2364aa;--ink:#182338;--muted:#66758a;--paper:#f4f7fb;--line:#dce4ef;--shadow:0 10px 28px #17396312}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,#103366,#2364aa);color:white;padding:22px max(18px,calc((100% - 1100px)/2))}.top h1{font-size:clamp(19px,3.2vw,29px);line-height:1.35;margin:8px 0;max-width:1050px}.top p{margin:0;color:#d5e7ff}.nav{display:flex;overflow:auto;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);padding:0 max(10px,calc((100% - 1100px)/2))}.tab{border:0;background:none;padding:15px;color:var(--muted);font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}main{max-width:1100px;margin:24px auto;padding:0 16px}.page{display:none}.page.active{display:block}.card,.event{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}h2{margin:0 0 5px}h3{margin:0 0 8px}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.team{background:white;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:15px;padding:14px}.field{width:100%;border:1px solid #ccd7e5;background:white;border-radius:10px;padding:10px;color:var(--ink);margin-top:7px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);margin-right:6px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rankcard{background:white;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:15px;padding:16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}.rankcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px #17396320}.rankcard.champion{background:linear-gradient(145deg,#fff8df,#fff 68%);border-color:#efd17c;border-top-color:#e5aa2f}.champ-label{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:99px;background:#fff0c2;color:#835700;font-size:12px;font-weight:850;vertical-align:middle}.winner-row{background:#fff9e8}.winner-pill{display:inline-block;margin-left:8px;padding:4px 9px;border-radius:99px;background:#ffe9a8;color:#795200;font-size:12px;font-weight:850;white-space:nowrap}.rankcard strong{font-size:24px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{padding:11px 8px;border-bottom:1px solid #edf0f5;text-align:center}th{font-size:12px;color:var(--muted)}td:first-child,th:first-child{text-align:left}.heats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.heat{border:1px solid var(--line);border-radius:14px;padding:12px}.row{display:grid;grid-template-columns:75px 1fr;align-items:center;gap:6px;margin:6px 0;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.time-picker{display:flex;align-items:center;gap:8px;margin-top:7px}.time-picker .field{margin-top:0}.time-picker select{min-width:82px;flex:1;text-align:center}.time-unit{font-weight:800;color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:var(--blue);color:white}.light{background:#edf4fb;color:var(--navy)}.check{display:block;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px}.hint{background:#f0f6ff;color:#345678;padding:12px;border-radius:10px;font-size:13px}.badge{background:#edf5ff;color:var(--blue);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182338;color:white;border-radius:99px;padding:11px 16px;opacity:0;transition:.2s}.toast.show{opacity:1}.footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}@media(max-width:650px){.grid,.podium{grid-template-columns:1fr}.events,.heats{grid-template-columns:1fr}.card{padding:14px}.rankcard{display:flex;justify-content:space-between;align-items:center}}
</style></head><body><header class="top"><div>IWAKUNI JUNIOR HIGH · SPORTS FESTIVAL</div><h1>山口県立岩国高等学校附属中学校　第１回体育祭　スコアボード</h1></header><nav class="nav"><button class="tab active" data-page="overall">🏆 総合ランキング</button><button class="tab" data-page="events">🎯 競技の入力</button><button class="tab" data-page="cheer">📣 応援合戦</button></nav><main><section id="overall" class="page active"><h2>🏆 いまの総合順位</h2><p class="muted">Prog2・3・4・7・8・9の得点を自動で合計します。</p><div id="podium" class="podium"></div><article class="card"><h3>競技別 得点一覧</h3><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></article></section><section id="events" class="page"><h2>🎯 競技の得点入力</h2><p class="muted">競技を選び、順位や得点を入力してください。</p><div id="eventList" class="events"></div><div id="detail"></div></section><section id="cheer" class="page"><h2>📣 応援合戦</h2><p class="muted">総合得点には含めず、単独で集計します。</p><article class="card"><div class="section-head"><h3>審査員投票</h3><button class="btn light" id="clearCheer">この競技をクリア</button></div><div class="grid" id="votes"></div><p class="hint">各合同団への投票数を集計します。6分を超えた場合は −1点。ボーナス欄を選ぶと +1点です。</p></article><article class="card"><h3>時間とボーナス</h3><div id="cheerTeams" class="grid"></div></article><article class="card"><h3>応援合戦 集計</h3><div class="tablewrap"><table><thead><tr><th>合同団</th><th>投票数</th><th>時間調整</th><th>ボーナス</th><th>合計点</th></tr></thead><tbody id="cheerRows"></tbody></table></div></article></section><div class="footer">入力内容はこのブラウザに自動保存されます。</div></main><div id="toast" class="toast"></div><script>
(()=>{const teams=[['red','赤団','#e64a54'],['white','白団','#95a3b7'],['blue','青団','#3478d4'],['yellow','黄団','#e9b52d'],['purple','紫団','#9063ce'],['green','緑団','#28a879']].map(([id,name,color])=>({id,name,color}));const evs=[{id:'p2',name:'Prog2 徒競走',short:'徒競走',desc:'10組・各順位 1位6点〜6位1点',type:'heats',max:10,pts:[6,5,4,3,2,1]},{id:'p3',name:'Prog3 附中ハリケーン５',short:'ハリケーン５',desc:'順位点 30・25・20・15・10・5点',type:'rank',pts:[30,25,20,15,10,5]},{id:'p4',name:'Prog4 一心異体',short:'一心異体',desc:'順位点 30・25・20・15・10・5点',type:'rank',pts:[30,25,20,15,10,5]},{id:'p7',name:'Prog7 障害物走',short:'障害物走',desc:'正解数 1問10点（最大100点）',type:'count',max:10,unit:'問',per:10},{id:'p8',name:'Prog8 綱引き',short:'綱引き',desc:'勝利数 1勝20点（最大60点）',type:'count',max:3,unit:'勝',per:20},{id:'p9',name:'Prog9 団別リレー',short:'団別リレー',desc:'順位点 60・50・40・30・20・10点',type:'rank',pts:[60,50,40,30,20,10]}];const ct=[{id:'ry',name:'赤・黄',members:['red','yellow'],color:'#e64a54'},{id:'wp',name:'白・紫',members:['white','purple'],color:'#9063ce'},{id:'bg',name:'青・緑',members:['blue','green'],color:'#3478d4'}];const blank=()=>({events:{p2:{heats:Array.from({length:10},()=>Array(6).fill(''))},p3:{rank:Array(6).fill('')},p4:{rank:Array(6).fill('')},p7:{count:Array(6).fill('')},p8:{count:Array(6).fill('')},p9:{rank:Array(6).fill('')}},cheer:{votes:Array(9).fill(''),times:['','',''],bonus:[false,false,false]}});let s=blank();const storageKey='iwakuniSportsFestScoreboard-v1';try{let x=JSON.parse(localStorage.getItem(storageKey)||localStorage.getItem('iwakuni-score-v1'));if(x?.events&&x?.cheer){s.events=x.events;s.cheer={votes:x.cheer.votes||x.cheer.performances||Array(9).fill(''),times:x.cheer.times||['','',''],bonus:x.cheer.bonus||x.cheer.bonuses||[false,false,false]}}}catch{}const $=x=>document.querySelector(x);function save(){localStorage.setItem(storageKey,JSON.stringify(s))}function teamOpts(v=''){return '<option value="">選んでください</option>'+teams.map(t=>`<option value="${t.id}" ${v===t.id?'selected':''}>${t.name}</option>`).join('')}function score(e,i){let d=s.events[e.id];if(e.type==='rank'){let n=+d.rank[i];return n?e.pts[n-1]:0}if(e.type==='count')return (+d.count[i]||0)*e.per;return d.heats.reduce((sum,h)=>sum+h.reduce((a,id,p)=>a+(id===teams[i].id?e.pts[p]:0),0),0)}function totals(){return teams.map((t,i)=>({t,vals:evs.map(e=>score(e,i))})).map(x=>({...x,total:x.vals.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total)}function renderSummary(){let a=totals(),last=null,r=0,ranked=a.map((x,i)=>{if(x.total!==last){last=x.total;r=i+1}return {...x,rank:r}});$('#podium').innerHTML=ranked.map((x)=>`<div class="rankcard ${x.rank===1&&x.total>0?'champion':''}" style="--c:${x.t.color}"><span>${x.total?`${x.rank}位${x.rank===1?' 🏆':''}`:'—'} <span class="dot"></span>${x.t.name}${x.rank===1&&x.total>0?'<span class="champ-label">優勝</span>':''}</span><strong>${x.total} 点</strong></div>`).join('');$('#thead').innerHTML='<tr><th>団</th>'+evs.map(e=>`<th>${e.short}</th>`).join('')+'<th>合計</th><th>順位</th></tr>';$('#tbody').innerHTML=ranked.map(x=>`<tr><td><span class="dot" style="--c:${x.t.color}"></span>${x.t.name}</td>${x.vals.map(v=>`<td>${v}</td>`).join('')}<td><b>${x.total}</b></td><td>${x.total?x.rank+'位':'—'}${x.rank===1&&x.total>0?' 🏆':''}</td></tr>`).join('')}function list(){ $('#eventList').innerHTML=evs.map(e=>`<article class="event" data-id="${e.id}"><span class="badge">総合に自動反映</span><h3>${e.name}</h3><p class="muted">${e.desc}</p></article>`).join('');$('#eventList').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(el.dataset.id))}function detail(id){let e=evs.find(x=>x.id===id),d=s.events[id],h=`<article class="card"><h3>${e.name}</h3><p class="muted">${e.desc}</p>`;if(e.type==='rank')h+='<div class="grid">'+teams.map((t,i)=>`<label class="team" style="--c:${t.color}"><span class="dot"></span>${t.name}<select class="field" data-in="rank-${i}"><option value="">順位を選ぶ</option>${e.pts.map((v,j)=>`<option value="${j+1}" ${+d.rank[i]===j+1?'selected':''}>${j+1}位・${v}点</option>`).join('')}</select></label>`).join('')+'</div>';if(e.type==='count')h+='<div class="grid">'+teams.map((t,i)=>`<label class="team" style="--c:${t.color}"><span class="dot"></span>${t.name}<select class="field" data-in="count-${i}"><option value="">入力してください</option>${Array.from({length:e.max+1},(_,n)=>`<option value="${n}" ${String(d.count[i])===String(n)?'selected':''}>${n}${e.unit}・${n*e.per}点</option>`).join('')}</select></label>`).join('')+'</div>';if(e.type==='heats')h+='<div class="heats">'+d.heats.map((heat,hi)=>`<div class="heat"><h3>${hi+1}組目</h3>${heat.map((v,p)=>`<div class="row"><span>${p+1}位 ${e.pts[p]}点</span><select class="field" data-in="heat-${hi}-${p}">${teamOpts(v)}</select></div>`).join('')}</div>`).join('')+'</div><p class="hint">各組の順位に団を割り当てます。未入力は0点です。</p>';h+='<div class="actions"><button class="btn light" id="clear">この競技をクリア</button></div></article>';$('#detail').innerHTML=h;$('#detail').scrollIntoView({behavior:'smooth',block:'start'});$('#detail').querySelectorAll('[data-in]').forEach(el=>el.onchange=()=>{let a=el.dataset.in.split('-');if(a[0]==='heat')d.heats[+a[1]][+a[2]]=el.value;else d[a[0]][+a[1]]=el.value;save();renderSummary()});$('#clear').onclick=()=>{if(!confirm('この競技の入力を消しますか？'))return;s.events[id]=e.type==='heats'?{heats:Array.from({length:10},()=>Array(6).fill(''))}:e.type==='rank'?{rank:Array(6).fill('')}:{count:Array(6).fill('')};save();renderSummary();detail(id)}}function cheer(){$('#votes').innerHTML=s.cheer.votes.map((v,i)=>`<label class="team">\u5be9\u67fb\u54e1 ${i+1}<select class="field" data-vote="${i}"><option value="">\u9078\u3093\u3067\u304f\u3060\u3055\u3044</option>${ct.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>`).join('');$('#votes').querySelectorAll('[data-vote]').forEach(el=>el.onchange=()=>{s.cheer.votes[+el.dataset.vote]=el.value;save();cheer()});$('#cheerTeams').innerHTML=ct.map((c,i)=>{let time=s.cheer.times[i],[min,sec]=time?time.split(':').map(Number):['',''];return `<div class="team" style="--c:${c.color}"><h3>${c.name}</h3><label class="muted">\u6f14\u6280\u6642\u9593</label><div class="time-picker"><select class="field" data-minutes="${i}"><option value="">--</option>${Array.from({length:11},(_,n)=>`<option value="${n}" ${String(min)===String(n)?'selected':''}>${String(n).padStart(2,'0')}</option>`).join('')}</select><span class="time-unit">\u5206</span><select class="field" data-seconds="${i}"><option value="">--</option>${Array.from({length:60},(_,n)=>`<option value="${n}" ${String(sec)===String(n)?'selected':''}>${String(n).padStart(2,'0')}</option>`).join('')}</select><span class="time-unit">\u79d2</span></div><label class="check"><input type="checkbox" data-bonus="${i}" ${s.cheer.bonus[i]?'checked':''}> 6\u5206\u3061\u3087\u3046\u3069\u30dc\u30fc\u30ca\u30b9 +1\u70b9</label></div>`}).join('');$('#cheerTeams').querySelectorAll('[data-minutes],[data-seconds]').forEach(el=>el.onchange=()=>{let i=+(el.dataset.minutes??el.dataset.seconds),m=$(`#cheerTeams [data-minutes="${i}"]`).value,x=$(`#cheerTeams [data-seconds="${i}"]`).value;s.cheer.times[i]=m===''||x===''?'':`${+m}:${String(+x).padStart(2,'0')}`;save();cheer()});$('#cheerTeams').querySelectorAll('[data-bonus]').forEach(el=>el.onchange=()=>{s.cheer.bonus[+el.dataset.bonus]=el.checked;save();cheer()});$('#clearCheer').onclick=()=>{if(!confirm('\u5fdc\u63f4\u5408\u6226\u306e\u5165\u529b\u3092\u3059\u3079\u3066\u6d88\u3057\u307e\u3059\u304b\uff1f'))return;s.cheer={votes:Array(9).fill(''),times:['','',''],bonus:[false,false,false]};save();cheer();toast('\u5fdc\u63f4\u5408\u6226\u3092\u30af\u30ea\u30a2\u3057\u307e\u3057\u305f')};let results=ct.map((c,i)=>{let n=s.cheer.votes.filter(v=>v===c.id).length,time=s.cheer.times[i],sec=0;if(time){let [m,x]=time.split(':').map(Number);sec=m*60+x}let adj=time&&sec>360?-1:0,bonus=s.cheer.bonus[i]?1:0;return {c,n,adj,bonus,total:n+adj+bonus}}),top=Math.max(...results.map(x=>x.total));$('#cheerRows').innerHTML=results.map(x=>{let champ=top>0&&x.total===top;return `<tr class="${champ?'winner-row':''}"><td>${x.c.name}</td><td>${x.n}</td><td>${x.adj}</td><td>${x.bonus}</td><td><b>${x.total}</b>${champ?'<span class="winner-pill">🏆 優勝</span>':''}</td></tr>`}).join('')}function toast(m){let x=$('#toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2000)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.page));window.scrollTo({top:0,behavior:'smooth'})});renderSummary();list();cheer()})();
</script></body></html>
